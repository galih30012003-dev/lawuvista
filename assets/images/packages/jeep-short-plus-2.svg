<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="0.5"/></filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="url(#g)"/>
  <!-- Subtle texture overlay -->
  <rect width="400" height="200" fill="rgba(0,0,0,0.15)"/>
  <!-- Landscape silhouette -->
  <ellipse cx="300" cy="220" rx="180" ry="90" fill="rgba(0,0,0,0.18)"/>
  <ellipse cx="80" cy="230" rx="120" ry="70" fill="rgba(0,0,0,0.14)"/>
  <!-- Icon circle -->
  <circle cx="200" cy="82" r="34" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <!-- Icon -->
  <g transform="translate(200,82)" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-18,6 Q-4,-18 16,0 Q4,16 -18,6Z"/><line x1="-4" y1="4" x2="-2" y2="16"/><line x1="6" y1="2" x2="-2" y2="16"/><circle cx="-2" cy="17" r="3" fill="rgba(255,255,255,0.7)" stroke="none"/>
  </g>
  <!-- Text background -->
  <rect x="0" y="148" width="400" height="52" fill="rgba(0,0,0,0.42)"/>
  <!-- Title -->
  <text x="200" y="171" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle" letter-spacing="0.5">Short Plus 2 · Rp450.000/Jeep</text>
  <!-- Subtitle -->
  <text x="200" y="189" font-family="system-ui,sans-serif" font-size="10.5" fill="rgba(255,255,255,0.82)" text-anchor="middle">Paralayang → Watu Payung → Offroad</text>
  <!-- Camera icon top-right (placeholder indicator) -->
  <g transform="translate(371,14)" fill="rgba(255,255,255,0.55)" stroke="none">
    <rect x="0" y="3" width="18" height="13" rx="2"/>
    <circle cx="9" cy="9.5" r="3.5" fill="rgba(0,0,0,0.4)"/>
    <rect x="5" y="0" width="8" height="4" rx="1"/>
  </g>
  <text x="369" y="34" font-family="system-ui,sans-serif" font-size="7" fill="rgba(255,255,255,0.55)" text-anchor="middle">FOTO</text>
</svg>